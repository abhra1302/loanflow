services:
  customer-db:
    image: postgres:16
    container_name: loanflow-customer-db
    environment:
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
      POSTGRES_DB: customerdb
    ports:
      - "5432:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data

volumes:
  customer-db-data: